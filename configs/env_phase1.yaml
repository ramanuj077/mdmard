# ============================================================
# MDMARD — Phase 1 Environment Configuration
# All physical and world constants live here.
# Zero magic numbers in source code.
# ============================================================

# --- World / Airspace ---
world:
  width: 1200          # pixels / simulation units
  height: 800
  floor: 50            # minimum altitude (terrain floor)
  ceiling: 750         # maximum altitude

# --- Aircraft Physics ---
physics:
  # Mass & inertia
  mass: 1.0            # kg (normalized)
  inertia: 0.1         # rotational inertia (kg·m²)

  # Thrust
  thrust_max: 15.0     # maximum thrust force (N)

  # Aerodynamics
  drag_coeff: 0.02     # Cd — translational drag
  lift_coeff: 0.08     # Cl — lift coefficient

  # Gravity
  gravity: 9.81        # m/s²

  # Velocity limits
  vel_max: 80.0        # m/s — structural speed limit
  vel_stall: 5.0       # m/s — below this = stall condition
  stall_steps: 15      # steps below v_stall before termination

  # Pitch
  pitch_max: 1.5708    # rad = π/2 — max pitch (no inverted flight Phase 1)
  pitch_rate_max: 2.0  # rad/s — max pitch rate
  pitch_torque: 5.0    # torque applied per pitch action unit

  # Integration
  dt: 0.05             # simulation timestep (seconds)

# --- Fuel ---
fuel:
  enabled: false       # disabled in Stage 1; enable in Stage 13+
  fuel_max: 1000.0     # fuel units
  burn_rate: 0.5       # fuel units per thrust unit per second

# --- Episode ---
episode:
  max_steps: 1000      # T_max — after this: truncated=True
  goal_radius: 30.0    # pixels — within this = waypoint captured

# --- Reward Weights ---
reward:
  w_approach: 1.0      # dense: negative delta-distance to goal
  w_waypoint: 200.0    # sparse: on goal capture
  w_fuel: 0.0          # dense: fuel consumption penalty (active when fuel enabled)
  w_alive: 0.1         # dense: per-step survival bonus
  w_crash: -100.0      # sparse: on crash / OOB
  w_smooth: -0.05      # dense: pitch rate penalty
  w_altitude: -0.5     # dense: proximity to floor/ceiling

# --- Observation ---
observation:
  vel_max_norm: 80.0   # normalization divisor for velocity
  omega_max_norm: 2.0  # normalization divisor for pitch rate
  dist_max_norm: 1442.0 # sqrt(1200² + 800²) — max possible distance
