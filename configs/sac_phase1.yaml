# ============================================================
# MDMARD — Phase 1 SAC Algorithm Configuration
# Soft Actor-Critic for Continuous Action Space (Stage 14)
# ============================================================

algorithm: "SAC"
policy: "MlpPolicy"

# --- Continuous Actor-Critic Hyperparameters ---
learning_rate: 0.0003
buffer_size: 200000
learning_starts: 1000
batch_size: 128
tau: 0.005
gamma: 0.99
train_freq: 1
gradient_steps: 1
ent_coef: "auto"
target_update_interval: 1
target_entropy: "auto"

# --- Network Architecture ---
net_arch:
  pi: [256, 256]
  qf: [256, 256]
activation_fn: "relu"

# --- Training Horizon ---
total_timesteps: 500000
eval_freq: 10000
eval_episodes: 20
save_freq: 25000
seed: 42
